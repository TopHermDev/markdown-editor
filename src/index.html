<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkFlow</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="toast.css">
</head>
<body>
  <div id="app">
    <!-- Toolbar -->
    <div id="toolbar">
      <div id="toolbar-left">
        <button id="btn-sidebar" title="Toggle sidebar (Ctrl+B)">&#9776;</button>
        <button id="btn-open" title="Open file (Ctrl+O)">Open</button>
        <div id="recent-wrapper">
          <button id="btn-recent" title="Recent files">Recent</button>
          <div id="recent-dropdown" class="hidden"></div>
        </div>
        <button id="btn-save" title="Save (Ctrl+S)">Save</button>
        <button id="btn-export-pdf" title="Export as PDF">PDF</button>
        <button id="btn-export-word" title="Export as Word">Word</button>
        <button id="btn-export-html" title="Export as HTML">HTML</button>
        <span id="filename">No file open</span>
      </div>
      <div id="toolbar-right">
        <span id="mode-indicator">EDIT</span>
        <button id="btn-preview" title="Toggle preview (E / Esc)">
          Preview
        </button>
        <button id="btn-split" title="Toggle split view (Ctrl+Enter)">
          Split
        </button>
        <button id="btn-theme" title="Toggle dark/light mode">
          <span id="theme-icon">&#9728;&#65039;</span>
        </button>
      </div>
    </div>

    <!-- Find & Replace Bar -->
    <div id="find-bar" class="hidden">
      <div id="find-bar-row">
        <input type="text" id="find-input" placeholder="Find" autocomplete="off" spellcheck="false">
        <span id="find-count"></span>
        <button id="find-prev" title="Previous match (Shift+Enter)">&#9650;</button>
        <button id="find-next" title="Next match (Enter)">&#9660;</button>
        <button id="find-case" title="Match case" class="find-toggle">Aa</button>
        <button id="find-word" title="Whole word" class="find-toggle">W</button>
        <button id="find-replace-toggle" title="Toggle replace (Ctrl+H)">Replace</button>
        <button id="find-close" title="Close (Escape)">&#10005;</button>
      </div>
      <div id="replace-bar-row" class="hidden">
        <input type="text" id="replace-input" placeholder="Replace" autocomplete="off" spellcheck="false">
        <button id="replace-one" title="Replace">Replace</button>
        <button id="replace-all" title="Replace all">All</button>
      </div>
    </div>

    <!-- Editor -->
    <div id="editor-container">
      <!-- File Tree Sidebar -->
      <aside id="sidebar" class="sidebar hidden">
        <div class="sidebar-header">
          <button id="btn-browse" title="Select folder">Browse&#8230;</button>
          <span id="sidebar-root-name" class="sidebar-root-name"></span>
        </div>
        <div id="file-tree" class="file-tree"></div>
      </aside>

      <div id="editor-pane">
        <textarea id="editor" spellcheck="false" placeholder="Type markdown here..."></textarea>
      </div>
      <div id="preview-pane" class="hidden">
        <div id="preview" class="markdown-body"></div>
      </div>
    </div>

    <!-- Status bar -->
    <div id="statusbar">
      <div id="statusbar-left">
        <span id="status-text">Ready</span>
        <span id="autosave-status"></span>
      </div>
      <div id="statusbar-right">
        <label id="autosave-toggle" title="Toggle autosave">

  <!-- Custom Theme Modal -->
  <div id="theme-modal-overlay" class="hidden">
    <div id="theme-modal">
      <div id="theme-modal-header">
        <h3>Preview Theme</h3>
        <button id="theme-modal-close" title="Close">✕</button>
      </div>
      <div id="theme-modal-body">
        <div id="theme-presets">
          <span class="theme-presets-label">Presets:</span>
          <button class="preset-btn" data-preset="github">GitHub</button>
          <button class="preset-btn" data-preset="solarized-dark">Solarized Dark</button>
          <button class="preset-btn" data-preset="solarized-light">Solarized Light</button>
          <button class="preset-btn" data-preset="nord">Nord</button>
          <button class="preset-btn" data-preset="dracula">Dracula</button>
        </div>
        <textarea id="theme-css-editor" spellcheck="false" placeholder="/* Custom CSS for the preview pane */"></textarea>
      </div>
      <div id="theme-modal-footer">
        <button id="theme-reset-btn" title="Reset to default (no custom CSS)">Reset</button>
        <button id="theme-apply-btn" title="Apply custom CSS">Apply</button>
      </div>
    </div>
  </div>
          <input type="checkbox" id="autosave-checkbox" checked>
          <span>Autosave</span>
        </label>
        <span id="cursor-pos">Ln 1, Col 1</span>
      </div>
    </div>
  </div>

  <!-- File input (hidden) -->
  <input type="file" id="file-input" accept=".md,.markdown,.txt,.rst" style="display:none">

  <!-- Libs -->
  <script src="lib/marked.min.js"></script>
  <script src="lib/html2pdf.bundle.min.js"></script>
  <script src="lib/docx.min.js"></script>
  <script src="lib/FileSaver.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
