[package]
name = "markdown-editor"
version = "0.4.0"
edition = "2021"
description = "Lightweight markdown reader and editor"
license = "MIT"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
